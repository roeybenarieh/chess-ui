name: images

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: chess-server
            context: .
            file: chess-ui/chess air_Server/Dockerfile
          - image: chess-web
            context: chess-ui/web
            file: chess-ui/web/Dockerfile
          - image: chess-bridge
            context: chess-ui/bridge
            file: chess-ui/bridge/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: chess-ui

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: type=sha,format=short,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
