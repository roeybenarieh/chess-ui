# The chess engine is vendored in ./chess-engine (no separate clone needed).
#
# The WinForms desktop client ("chess air_client") is NOT part of this compose
# file - it's a native Windows GUI app and can't run in a Linux container.
# Run it on a Windows host/VM and point its hardcoded server IP (Program.cs)
# at this machine's address, port 500.

services:
  db:
    build:
      context: .
      dockerfile: db/Dockerfile
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${DB_SA_PASSWORD:?set DB_SA_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-ChessDB}
    volumes:
      - chess-db-data:/var/opt/mssql/data
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  server:
    build:
      context: ..
      dockerfile: chess-ui/chess air_Server/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_LISTEN_IP: "0.0.0.0"
      SERVER_PORT: "500"
      DB_HOST: db
      DB_PORT: "1433"
      DB_NAME: ${DB_NAME:-ChessDB}
      DB_USER: sa
      DB_PASSWORD: ${DB_SA_PASSWORD:?set DB_SA_PASSWORD in .env}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    ports:
      - "500:500"

volumes:
  chess-db-data:
